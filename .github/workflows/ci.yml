name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10.28.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build Docker image
        run: docker build -t webhook-frontend:${{ github.sha }} .

  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/srgbleta/webhook-frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish image
        run: |
          TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          docker build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/srgbleta/webhook-delivery-fe" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$TAG" .

          docker push "$IMAGE:$TAG"

          echo "Published image: $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
